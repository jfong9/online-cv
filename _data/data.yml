experiences:
    - role: Software Developer
      time: November 2020 - Present
      company: KMS Service Inc. (A Kikkoman subsidiary)
      details: |
        Work with a small team responsible for maintaining, updating, and migrating Kikkoman Sales, USA’s legacy systems.
        - Sage 300 Migration (C#, .NET, WPF, SQL, EDI, Git)
          - Migrating Kikkoman Sales, USA’s operations from legacy VB6 programs to a mix of .NET programs integrating with 
            Sage 300. This included stream lining, identifying, and encapsulating business needs to newer and more efficient 
            operations while eliminating others.
          - Developed common libraries, including a Sage 300 API wrapper for other developers to use and share among teams. 
            This standardized Sage 300 programming while separating business specific code, allowing us to share our team’s 
            library with other subsidiaries of Kikkoman Corporation. 
          - Transitioned the team from manual source control of copy and pasting folders to using Git for all new development.
          - Developed company wide EDI methodology used to create and read raw EDI protocols. Inbound EDI data then used to 
            automate creation of various Sage 300 transactions.

    - role: Software Engineer
      time: March 2016 - July 2019
      company: Westinghouse Electric Corporation
      details: |
        Worked with an internal tools team to develop/implement new standard software used by other teams.
        - Created a full stack AutoCAD Drawing Tool. A Windows
          client/service application developed using C#, .NET, WCF, WPF, SQL, and the AutoCAD API
          to read a customer’s database and dynamically create AutoCAD drawings.
          - Replaced an aging platform with a modernized tool based on the .NET 
            framework which was made more user friendly, intuitive, and flexible 
            to cater to different customers’ needs.
          - Improved efficiency by reducing a highly used process that 
            took hours to run down to minutes.
          - Increased accessibility and collaboration capabilities through design choices.
          - Saved hours of overhead with content creation by designing the process 
            to be simpler, flexible and reusable.
        Worked with a small test team to write test procedures and develop/create test cases for Nuclear Application Programs.
        - Created OPAL Table Generator - (VBA, Python):
          - Used VBA in MS Excel to generate Python interface code. Python then used to simulate and calculate nuclear 
            application logic and generate verification tests.
          -	Reduced costs through reducing human error, improving efficiency, and increasing troubleshooting capabilities.
          -	Enabled non-programmers a way to write programmatic tests, allowing for more team involvement. 

    - role: Software Engineer
      time: June 2010 - July 2015
      company: C3-ilex
      details: |
        - Worked on a high-speed multi-threaded real-time data
          acquisition system (C++, MFC, VBA, FORTRAN, C#) to debug and
          resolve customer issues. Issues ranged from critical, hard to find, pre-existing 
          bugs (buffer overflow) to cosmetic user interface changes and functionality.
        - Successfully worked with customers to develop new functionality going from requirements to completion.

    - role: Senior Instructor
      time: July 1999 - Present
      company: Yee's Martial Arts Academy
      details: |
        - 30+ years of martial arts training – able to stay level headed and think through problems during stressful situations.
        - Leadership skills, group management, dedication, discipline, and experience in working with and skilling up many types of people. 
        - Manage classes with 15 to 30 students of all ages, ranging from 4 to 60+ years old. Adapting to each of their individual learning methods and physical capabilities through differentiated instruction.  

